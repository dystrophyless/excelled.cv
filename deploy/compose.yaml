name: novio

x-logging: &logging
  driver: local

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: novio
      POSTGRES_USER: novio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${NOVIO_DATA_DIR:?}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U novio -d novio"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *logging

  api:
    image: ${NOVIO_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://novio:${POSTGRES_PASSWORD:?}@db:5432/novio
      SECRET_KEY: ${SECRET_KEY:?}
      ENVIRONMENT: production
      FRONTEND_ORIGIN: ${NOVIO_FRONTEND_ORIGIN:?}
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/catalog', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
    logging: *logging

  web:
    image: ${NOVIO_IMAGE:?}
    pull_policy: never
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    environment:
      NOVIO_SITE: ${NOVIO_SITE:?}
    ports:
      - "${NOVIO_BIND_ADDRESS:-0.0.0.0}:${NOVIO_HTTP_PORT:-80}:80"
      - "${NOVIO_BIND_ADDRESS:-0.0.0.0}:${NOVIO_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${NOVIO_SMOKE_PORT:-18081}:8081"
    volumes:
      - ${NOVIO_DATA_DIR:?}/caddy-data:/data
      - ${NOVIO_DATA_DIR:?}/caddy-config:/config
    logging: *logging
